name: openlaunch checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build:pi
      - run: npm run build:site
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      - run: npm run check:site
      - run: python3 scripts/test-install-pi.py
      - run: python3 tests/provision-uno.test.py
      - run: python3 tests/test_provision_esp32.py
      - run: npm run test:device
      - run: npm run build --workspace @openlaunch/web
      - run: npm run test:e2e
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build:pi
      - run: npm run build:site
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      - run: npm run check:site
      - run: python3 scripts/test-install-pi.py
      - run: python3 tests/provision-uno.test.py
      - run: python3 tests/test_provision_esp32.py
      - run: npm run typecheck --workspace @openlaunch/cloud
      - run: npm run build --workspace @openlaunch/cloud
        env:
          CF_SEND_TELEMETRY: "false"
      - run: npm run test:cloud-storage
      - run: npm run build --workspace @openlaunch/web
      - run: cd devices/pi && go test ./... && go build -o ../../dist/openlaunch-device-host ./cmd/openlaunch-device
      - run: node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: openlaunch-website
          path: apps/site/dist/client
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: openlaunch-pi-binaries
          path: dist/openlaunch-device-linux-*
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - run: arduino-cli core update-index && arduino-cli core install arduino:renesas_uno@1.6.0
      - run: node --test tests/firmware-profile.test.mjs
      - run: npm run prepare:firmware
      - run: arduino-cli --config-file build/firmware/stock/arduino-cli.json lib update-index
      - run: arduino-cli --config-file build/firmware/stock/arduino-cli.json lib install ArduinoJson@7.4.3 ArduinoHttpClient@0.6.2 ArduinoGraphics@1.1.5 ArduinoBLE@2.1.0
      - run: npm run build:firmware
      - run: git clone --no-checkout https://github.com/pkyanam/ArduRoomba.git /tmp/openlaunch-ArduRoomba
      - run: git -C /tmp/openlaunch-ArduRoomba checkout --detach 5120998789100c1aade14ebe0645524cae6f9349
      - run: node scripts/firmware.mjs --sketch openlaunch_roomba --roomba-library /tmp/openlaunch-ArduRoomba
      - run: sh tests/host/roomba/run.sh
      - run: npm ci
      - run: node --import tsx --test tests/firmware/*.test.mjs
      - run: python3 tests/provision-roomba.test.py

  deploy-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [mac-smoke, software, firmware]
    runs-on: ubuntu-latest
    concurrency:
      group: openlaunch-site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: openlaunch-website
          path: apps/site/dist/client
      - run: node scripts/deploy-cloud.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DEVICE_CREDENTIAL_KEYS: ${{ secrets.DEVICE_CREDENTIAL_KEYS }}
          DEVICE_CREDENTIAL_KEY_VERSION: ${{ vars.DEVICE_CREDENTIAL_KEY_VERSION }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          OPENLAUNCH_CONTROLS_ENABLED: ${{ vars.OPENLAUNCH_CONTROLS_ENABLED }}
      - run: npx wrangler pages deploy --cwd apps/site --project-name openlaunch-site --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: python3 scripts/verify-hosted.py
