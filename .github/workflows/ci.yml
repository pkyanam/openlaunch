name: openlaunch checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build:site
      - run: npm run check:site
      - run: python3 tests/provision-uno.test.py
      - run: npm run test:device
      - run: npm run build --workspace @openlaunch/web
      - run: npm run test:e2e
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build:site
      - run: npm run check:site
      - run: python3 tests/provision-uno.test.py
      - run: npm run typecheck --workspace @openlaunch/cloud
      - run: npm run build --workspace @openlaunch/cloud
        env:
          CF_SEND_TELEMETRY: "false"
      - run: npm run build --workspace @openlaunch/web
      - run: cd devices/pi && go test ./... && go build -o ../../dist/openlaunch-device-host ./cmd/openlaunch-device
      - run: node scripts/e2e.mjs
      - run: npm run build:pi
      - uses: actions/upload-artifact@v4
        with:
          name: openlaunch-pi-binaries
          path: dist/openlaunch-device-linux-*
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - run: arduino-cli core update-index && arduino-cli core install arduino:renesas_uno@1.6.0
      - run: node --test tests/firmware-profile.test.mjs
      - run: npm run prepare:firmware
      - run: arduino-cli --config-file build/firmware/stock/arduino-cli.json lib update-index
      - run: arduino-cli --config-file build/firmware/stock/arduino-cli.json lib install ArduinoJson@7.4.3 ArduinoHttpClient@0.6.2 ArduinoGraphics@1.1.5
      - run: npm run build:firmware
